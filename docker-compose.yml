version: '3.8'

services:
  tecsuite:
    build: .
    image: tec-suite:latest
    env_file:
      - .env
    # run interactively by default so you can see the log; override
    # command with arguments to process_rinex.py as needed
    command: -h
    volumes:
      - ./tecs.cfg:/app/tecs.cfg:ro
      #- ./out:/app/out
      # mount a directory containing RINEX data when running
      #   - /path/to/rinex:/data/rinex
      - ${RINEX_DATA_PATH_HOST}:${RINEX_DATA_PATH}:rw
      - ${TECSUITE_OUT_DAT_DATA_PATH_HOST}:${TECSUITE_OUT_DAT_DATA_PATH}:rw
      # You can use the variables from .env to mount the host RINEX root
      # into the container. Example (uncomment to enable):
      #   - ${RINEX_DATA_PATH_HOST}:${RINEX_DATA_PATH}:ro
      # Similarly, mount the host output directory into the container:
      #   - ${TECSUITE_OUT_DAT_DATA_PATH_HOST}:${TECSUITE_OUT_DAT_DATA_PATH}:rw
    working_dir: /app
    stdin_open: true
    tty: true
